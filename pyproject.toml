[project]
name = "catpaw"
version = "0.1.0"
description = "Multi-agent VASP calculation workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ase>=3.28.0",
    "chgnet>=0.4.2",
    "matplotlib>=3.10.8",
    "markdown-it-py>=4.0.0",
    "lmnr>=0.7.48",
    "mp-api>=0.46.0",
    "numpy>=2.4.3",
    "openhands-agent-server>=1.18.1",
    "openhands-sdk>=1.18.1",
    "openhands-tools>=1.18.1",
    "openhands-workspace>=1.18.1",
    "pydantic>=2.12.5",
    "pubchempy>=1.0.5",
    "psutil>=7.2.2",
    "pymatgen>=2025.10.7",
    "pyyaml>=6.0.3",
    "rdkit==2025.9.6",
    "requests>=2.32.5",
    "torch==2.6.0",
    "watchfiles>=1.1.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
