slab_opt:
  description: 'Used for structural optimization of 2D surface (slab) models and surface-adsorbate systems. Core principle: never change cell shape or volume, to preserve vacuum-layer stability.'
  pre_requisite_checks:
  - POSCAR must exist and must not be modified by ParamWorker.
  - Preserve any Selective Dynamics flags already present in POSCAR, but do not invent fixed layers or route back solely because bottom layers are not fixed. Standard surface-energy slabs may intentionally have no fixed atoms.
  incar_rules:
    mandatory:
      ISIF: 2
      IBRION: 1
      NSW: 300
      NELM: 400
      EDIFF: 1e-5
      EDIFFG: -0.05
    dynamic_logic:
    - If the system contains magnetic elements (for example Fe, Co, Ni transition-metal surfaces), enforce ISPIN=2. CreateIncar will auto-generate reasonable MAGMOM; ParamWorker does not need to pass MAGMOM manually unless special requirements exist.
    - Use PotcarEncutEvaluator to choose ENCUT from pseudopotential ENMAX evidence.
    - For mixed-metal slabs, enforce ISYM=0 because chemical substitution lowers the true symmetry and small lattice roundoff can otherwise produce inconsistent direct/reciprocal Bravais classifications. Single-metal slabs keep the standard symmetry default.
    - ISIF=2 must be set, and ISIF=3 is forbidden.
  completion_profile_overrides:
    demonstration:
      applies_only_when: 'COMPLETION_POLICY.profile is demonstration'
      mandatory:
        ISIF: 2
        IBRION: 2
        POTIM: 0.3
        NSW: 120
        NELM: 400
        EDIFF: 1e-5
        EDIFFG: -0.10
      preserve: ['ENCUT', 'KPOINTS', 'POTCAR', 'ISPIN', 'DFT+U', 'vdW']
  kpoints_rules:
    strategy: Gamma-centered 2D-Mesh
    instructions: 'For the vacuum direction (usually Z axis, with lattice constant c > 15 A), the K-point value must be fixed to 1. In-plane (x, y) K points are auto-generated by CreateKpoints using empirical rule k = 20 / cell length. ParamWorker should verify the generated K grid has form [Kx, Ky, 1]. Note: K-point count directly affects compute cost; do not manually densify without physical justification.'
  audit_criteria:
  - INCAR must use ISIF=2.
  - Mixed-metal slabs must use ISYM=0.
  - KPOINTS must use 1 point along the vacuum direction.
