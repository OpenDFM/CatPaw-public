dos_calc:
  description: Used for non-self-consistent field (Non-SCF) calculations based on known accurate charge density, to obtain high-precision total DOS (TDOS) and projected DOS (PDOS).
  pre_requisite_checks:
  - Read inputs.json for the named upstream final structure and required charge/wavefunction artifacts. ModelingWorker prepares POSCAR from the optimized structure; ParamWorker copies only the electronic artifacts required by this stage into its calculation directory.
  - CHGCAR must come from a converged SCF node, not directly from structure optimization (bulk_opt/slab_opt).
  incar_rules:
    mandatory:
      ICHARG: 11
      IBRION: -1
      NSW: 0
      NELM: 400
      LORBIT: 11
      ALGO: Normal
      NEDOS: 3000
      EMIN: -20
      EMAX: 20
    dynamic_logic:
    - '[Parameter inheritance]: all parameters involved in Hamiltonian construction, including ENCUT, ISPIN, and GGA (if DFT+U is used), must be fully consistent with the prerequisite SCF task. Changing cutoff energy in DOS calculation is strictly forbidden.'
    - '[FFT grid inheritance]: if the prerequisite SCF used NGXF/NGYF/NGZF (densified grid), the DOS calculation MUST set identical NGXF/NGYF/NGZF values. Otherwise VASP cannot read the SCF CHGCAR and will abort with "charge density could not be read". Extract these values with `grep NGXF OUTCAR` from the SCF directory.'
  kpoints_rules:
    strategy: High-density Gamma-centered
    instructions: DOS calculation requires dense K points to ensure smooth and accurate curves. When CreateKpoints receives task_type='dos_calc', it automatically increases K-point density by 2.5x (about k=50/cell length), so ParamWorker usually does not need to pass custom_grid manually. For higher precision, custom_grid can be provided to override. For slab models with vacuum, vacuum-direction K point still remains automatically fixed to 1.
  audit_criteria:
  - INCAR must use ICHARG=11, IBRION=-1, and NSW=0.
  - Required inherited POSCAR and CHGCAR inputs must be non-empty before submission.
  - KPOINTS should use the dos_calc density generated by CreateKpoints unless a documented custom grid is required.
